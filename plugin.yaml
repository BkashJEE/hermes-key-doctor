name: hermes-key-doctor
version: "0.2.1"
manifest_version: 2
api_version: 1
description: "Why did my Hermes key stop working? Shows every Bot's logins (benched, dead, or blocked for one model), why, until when, and the exact fix. Inside Hermes Desktop, as /keys, and as `hermes keydoctor`. Read-only; never shows a token."
author: Bikash Joshi
license: MIT
homepage: https://github.com/BkashJEE/hermes-key-doctor
tags: [desktop, auth, credentials, diagnostics]
requires_hermes: ">=0.21.5"
provides_commands:
  - keydoctor
